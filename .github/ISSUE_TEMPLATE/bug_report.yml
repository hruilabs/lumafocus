name: 问题报告
description: 帮助我们定位 Luma 的功能或体验问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请不要在公开 Issue 中包含密码、令牌、个人信息或完整的敏感日志。
  - type: input
    id: luma-version
    attributes:
      label: Luma 版本
      description: 可在 Luma 的“关于”页面查看。
      placeholder: 例如 1.0.0
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS 版本
      placeholder: 例如 macOS 15.5
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按顺序写出操作过程。
      placeholder: |
        1. 打开 Luma
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: 补充信息
      description: 可附上已脱敏的截图或其他上下文。
  - type: checkboxes
    id: acknowledgement
    attributes:
      label: 提交前确认
      options:
        - label: 我确认没有在此 Issue 中包含敏感信息。
          required: true
